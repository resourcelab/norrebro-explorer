# Publish the game to GitHub Pages on every push to main: https://resourcelab.github.io/norrebro-explorer/
# The site is the prototype's dist/ (index.html and the world tiles it loads as you walk), rebuilt from source.
# One-time setup in the repo on GitHub:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish the game

on:
  push:
    branches: [main]
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r prototypes/assistens-paper-map/dist/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
